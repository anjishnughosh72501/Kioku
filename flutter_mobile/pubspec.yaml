name: flutter_mobile
description: "Kioku - A warm memory album shared with close friends"
publish_to: 'none'
version: 3.5.0+5

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  meta: ^1.15.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Google Sign-In & Drive (local-first: the signed-in user's own Drive is storage)
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: 2.3.3
  http: ^1.6.0

  # Storage & Preferences
  shared_preferences: ^2.2.3
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.4

  # Cryptography (Ente-aligned E2EE)
  sodium_libs: ^2.2.1
  bip39: ^1.0.6
  crypto: ^3.0.6
  xml: ^6.5.0

  # Media
  photo_view: ^0.15.0
  video_player: ^2.8.2
  chewie: ^1.7.5
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # UI & Animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.2.0
  gap: ^3.0.1

  # EXIF & Utils
  exif: ^3.2.2
  intl: ^0.19.0
  share_plus: ^10.0.2

  # Path & File handling
  path: ^1.9.0
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.12
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

dependency_overrides:
  # path_provider_foundation >=2.5.0 pulls objective_c 9.x, whose native-assets
  # hook compile fails when the project path contains spaces (Windows).
  # 2.4.1 is the last version without the objective_c dependency.
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/kiokulogo.jpg
    - assets/kiokulogo.png